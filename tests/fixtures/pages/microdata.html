<!doctype html>
<html lang="en">
  <head>
    <title>Jobs at Umbrella</title>
  </head>
  <body>
    <article itemscope itemtype="https://schema.org/JobPosting">
      <h1 itemprop="title">Lab Technician</h1>
      <div itemprop="hiringOrganization" itemscope itemtype="https://schema.org/Organization">
        <span itemprop="name">Umbrella Health</span>
      </div>
      <div itemprop="jobLocation" itemscope itemtype="https://schema.org/Place">
        <div itemprop="address" itemscope itemtype="https://schema.org/PostalAddress">
          <span itemprop="addressLocality">Raccoon City</span>,
          <span itemprop="addressRegion">MO</span>
        </div>
      </div>
      <meta itemprop="jobLocationType" content="TELECOMMUTE" />
      <div itemprop="baseSalary" itemscope itemtype="https://schema.org/MonetaryAmount">
        <meta itemprop="currency" content="USD" />
        <span itemprop="value" itemscope itemtype="https://schema.org/QuantitativeValue">
          <span itemprop="value">$4,200</span>
          <meta itemprop="unitText" content="MONTH" />
        </span>
      </div>
    </article>
  </body>
</html>
